<ng-template #modalContent let-modal>
  <div class="modal-header">
    <h5 class="modal-title">PDF com senha</h5>
    <button type="button" class="btn-close" aria-label="Fechar" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <app-loading [show]="loading"></app-loading>

    <p>
      Para desbloquear a nota, informe o CPF/CNPJ do titular. Ele será vinculado à sua conta e não
      poderá ser editado depois.
    </p>

    <form class="form" #f="ngForm" (ngSubmit)="submitUserDocumentForm(f.form)" ngNativeValidate>
      <div class="mb-3">
        <label class="form-label" for="userDoc">CPF/CNPJ <i>(somente números)</i></label>
        <input
          type="tel"
          class="form-control form-control-lg"
          id="userDoc"
          mask="000.000.000-00||00.000.000/0000-00"
          name="userDoc"
          placeholder="CPF / CNPJ"
          required
          ngModel
        />
      </div>
      <div class="mb-3 d-grid">
        <button type="submit" class="btn btn-lg btn-primary">Salvar</button>
      </div>
    </form>
  </div>
</ng-template>
